<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090c12">
<title>NEXUS RP — Prototype 001</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090c12;color:#fff;font-family:system-ui,-apple-system,Arial;touch-action:none}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;align-items:start}.brand{font-weight:950;letter-spacing:.2em;font-size:17px;text-shadow:0 2px 12px #000}.brand small{display:block;color:#aeb7c4;font-size:8px;letter-spacing:.3em;margin-top:4px}.pill{background:#101722d9;border:1px solid #aeb9c833;border-radius:20px;padding:8px 11px;font-size:10px;color:#dbe2eb}#hint{position:absolute;top:76px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#101722dd;border:1px solid #aeb9c833;border-radius:20px;padding:8px 12px;font-size:11px;color:#dce3ec}#bottom{position:absolute;left:16px;right:16px;bottom:max(18px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:end}#stick{width:118px;height:118px;border-radius:50%;background:#0c121bcc;border:1px solid #cbd3df66;position:relative;pointer-events:auto}#nub{position:absolute;width:48px;height:48px;border-radius:50%;left:34px;top:34px;background:linear-gradient(145deg,#edf0f4,#7e8998);box-shadow:0 3px 18px #0009}.actions{display:flex;gap:9px;pointer-events:auto}.action{width:66px;height:66px;border-radius:50%;border:1px solid #cbd3df77;background:#111925e8;color:white;font-weight:850;font-size:9px;letter-spacing:.04em}.action.primary{background:linear-gradient(145deg,#e6e9ee,#8792a0);color:#111722;border:0}#toast{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);background:#111925ed;border:1px solid #aeb9c855;border-radius:18px;padding:9px 13px;font-size:12px;opacity:0;transition:opacity .2s;white-space:nowrap}#start{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 50% 38%,#293747,#101722 48%,#07090d)}.panel{width:min(420px,100%);padding:30px 22px;text-align:center;border:1px solid #b8c2d044;background:#0b1019dc;border-radius:24px;box-shadow:0 24px 80px #0009}.logo{font-size:34px;font-weight:950;letter-spacing:.2em;margin-left:.2em}.sub{font-size:10px;letter-spacing:.3em;color:#aab4c2;margin:8px 0 25px}.panel p{font-size:13px;line-height:1.55;color:#c5ced9}#play{margin-top:12px;width:100%;border:0;border-radius:14px;padding:16px;background:linear-gradient(110deg,#e6e9ee,#929dab);color:#111722;font-weight:950;letter-spacing:.14em}.note{font-size:10px!important;color:#8793a2!important;margin-top:16px}
</style></head><body><div id="world"></div><div id="hud"><div class="top"><div class="brand">NEXUS RP<small>YOUR CITY. YOUR STORY.</small></div><div class="pill">PROTOTYPE 001 · TESTBUILD</div></div><div id="hint">NEXUS CITY · Erkunde die Umgebung</div><div id="bottom"><div id="stick"><div id="nub"></div></div><div class="actions"><button class="action" id="sprint">SPRINT</button><button class="action primary" id="vehicle">FAHRZEUG</button></div></div><div id="toast"></div></div><div id="start"><div class="panel"><div class="logo">NEXUS RP</div><div class="sub">YOUR CITY. YOUR STORY.</div><p>Willkommen in deinem ersten spielbaren Ausschnitt von NEXUS City.<br>Bewege deinen Charakter und probiere das erste Auto aus.</p><button id="play">SPIEL STARTEN</button><p class="note">PROTOTYP 001 · 3D-BROWSER-DEMO · OFFLINE-TEST</p></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const host=document.querySelector('#world'),scene=new THREE.Scene();scene.background=new THREE.Color(0x9baebe);scene.fog=new THREE.Fog(0x9baebe,48,150);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,250);const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdceaff,0x46505b,2));const sun=new THREE.DirectionalLight(0xffe5c2,2);sun.position.set(-30,60,20);scene.add(sun);
const material=(c,r=.85,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const asphalt=material(0x252b33),sidewalk=material(0x737d86),grass=material(0x52675b),white=material(0xe0e4e8),glass=material(0x29404e,.3,.3);
function block(w,h,d,mat,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);parent.add(o);return o}
block(220,.1,220,grass,0,-.12,0);block(15,.12,190,asphalt,0,0,0);block(190,.12,15,asphalt,0,0,0);for(const z of [-9,9])block(190,.18,3,sidewalk,0,.02,z);for(const x of [-9,9])block(3,.18,190,sidewalk,x,.02,0);
for(let i=-11;i<=11;i++){block(.15,.02,2.8,white,0,.08,i*8);block(2.8,.02,.15,white,i*8,.08,0)}
const facades=[0x74818d,0x9b9da0,0x596b7b,0xb0a99d,0x5c626b,0x8d969b].map(c=>material(c));const windowMat=material(0x9eb6c2,.3,.15);
for(let x=-5;x<=5;x++)for(let z=-5;z<=5;z++){let px=x*17+(x<0?-7:7),pz=z*17+(z<0?-7:7);if(Math.abs(px)<16||Math.abs(pz)<16)continue;let h=9+(Math.abs(x*13+z*7)*7)%24,w=7+(Math.abs(x*3+z*11)*3)%5,d=7+(Math.abs(x*5-z*9)*2)%5;block(w,h,d,facades[Math.abs(x*7+z*3)%facades.length],px,h/2,pz);for(let yy=3;yy<h-1;yy+=3.2)block(w*.78,.72,.04,windowMat,px,yy,pz+d/2+.03)}
const trunk=material(0x554638),leaves=material(0x365c4b);for(let i=0;i<34;i++){let x=(i*37%130)-65,z=(i*53%130)-65;if(Math.abs(x)<14||Math.abs(z)<14)continue;block(.4,2,.4,trunk,x,1,z);const crown=new THREE.Mesh(new THREE.SphereGeometry(1.35,7,6),leaves);crown.position.set(x,3,z);scene.add(crown)}
const player=new THREE.Group();scene.add(player);const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.4,.8,4,8),material(0x202b3a));torso.position.y=1.12;player.add(torso);const jacket=new THREE.Mesh(new THREE.BoxGeometry(.86,.62,.43),material(0x9da8b6));jacket.position.y=1.28;player.add(jacket);const head=new THREE.Mesh(new THREE.SphereGeometry(.3,12,10),material(0xc99e7d));head.position.y=1.98;player.add(head);for(const x of [-.2,.2]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.22,.68,.24),material(0x20242b));leg.position.set(x,.4,0);player.add(leg)}player.position.set(0,0,4);
const car=new THREE.Group();scene.add(car);car.position.set(5,0,3);block(2.1,.62,4,material(0x9da7b5,.32,.7),0,.7,0,car);block(1.55,.68,1.8,glass,0,1.28,-.2,car);block(1.5,.12,1.5,material(0x343c47,.4,.4),0,1.65,-.2,car);for(const x of [-1.05,1.05])for(const z of [-1.25,1.25]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.22,12),material(0x111316));wheel.rotation.z=Math.PI/2;wheel.position.set(x,.4,z);car.add(wheel)}for(const x of [-.68,.68])block(.38,.16,.06,material(0xe8e2c9,.35,.2),x,.78,2.03,car);
let inCar=false,speed=0,joy={x:0,y:0},joyOn=false,sprinting=false,heading=0;const stick=document.querySelector('#stick'),nub=document.querySelector('#nub'),keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function moveJoy(e){const r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy),m=37;let x=dx,y=dy;if(l>m){x=x/l*m;y=y/l*m}joy.x=x/m;joy.y=y/m;nub.style.transform=`translate(${x}px,${y}px)`}stick.addEventListener('pointerdown',e=>{joyOn=true;stick.setPointerCapture(e.pointerId);moveJoy(e)});stick.addEventListener('pointermove',e=>{if(joyOn)moveJoy(e)});function stopJoy(){joyOn=false;joy.x=joy.y=0;nub.style.transform='translate(0,0)'}stick.addEventListener('pointerup',stopJoy);stick.addEventListener('pointercancel',stopJoy);
const sprintBtn=document.querySelector('#sprint');sprintBtn.addEventListener('pointerdown',()=>sprinting=true);['pointerup','pointercancel','pointerleave'].forEach(ev=>sprintBtn.addEventListener(ev,()=>sprinting=false));function toast(msg){const t=document.querySelector('#toast');t.textContent=msg;t.style.opacity=1;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.opacity=0,1700)}
document.querySelector('#vehicle').onclick=()=>{if(!inCar&&player.position.distanceTo(car.position)<5){inCar=true;player.visible=false;toast('Du sitzt im Fahrzeug.');document.querySelector('#vehicle').textContent='AUSSTEIGEN'}else if(inCar){inCar=false;player.visible=true;player.position.copy(car.position).add(new THREE.Vector3(2,0,0));toast('Du bist ausgestiegen.');document.querySelector('#vehicle').textContent='FAHRZEUG'}else toast('Geh näher an das Auto heran.')};document.querySelector('#play').onclick=()=>{document.querySelector('#start').style.display='none';toast('Willkommen in NEXUS City!')};
const clock=new THREE.Clock();function update(dt){let x=joy.x+(keys.d?1:0)-(keys.a?1:0),y=joy.y+(keys.s?1:0)-(keys.w?1:0),l=Math.hypot(x,y);if(l>1){x/=l;y/=l}if(inCar){speed+=-y*dt*12;speed*=Math.pow(.975,dt*60);speed=THREE.MathUtils.clamp(speed,-5,18);car.rotation.y-=x*dt*(Math.abs(speed)*.075+.25);const f=new THREE.Vector3(Math.sin(car.rotation.y),0,Math.cos(car.rotation.y));car.position.addScaledVector(f,speed*dt);car.position.x=THREE.MathUtils.clamp(car.position.x,-88,88);car.position.z=THREE.MathUtils.clamp(car.position.z,-88,88);player.position.copy(car.position)}else if(l>.08){const v=sprinting||keys.shift?8:4.2;heading=Math.atan2(x,y);player.rotation.y=heading;player.position.x+=x/l*v*dt;player.position.z+=y/l*v*dt;player.position.x=THREE.MathUtils.clamp(player.position.x,-90,90);player.position.z=THREE.MathUtils.clamp(player.position.z,-90,90)}const target=inCar?car.position:player.position,angle=inCar?car.rotation.y:player.rotation.y,offset=new THREE.Vector3(-Math.sin(angle)*8,5.2,-Math.cos(angle)*8);camera.position.lerp(new THREE.Vector3(target.x+offset.x,target.y+offset.y,target.z+offset.z),1-Math.pow(.001,dt));camera.lookAt(target.x,target.y+1.2,target.z)}function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.04);update(dt);renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))});
</script></body></html>
